<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>EqualVoice</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

  <nav>
      <h2>EqualVoice</h2>
  <ul>

    <li><a href="home.html">Home</a></li>

    <li><a href="index.html">Register</a></li>

    <li><a href="mentorship.html">Mentorship</a></li>

    <li><a href="counseling.html">Counseling</a></li>

    <li><a href="legal.html">Legal Support</a></li>

    <li><a href="internships.html">Internships</a></li>

    <li><a href="education.html">Education</a></li>

    <li><a href="report.html">Report</a></li>

  </ul>

</nav><br>


  <div class="container">

    <div class="form-card">

      <h1>EqualVoice</h1>

      <p class="subtitle">
        Empowering equality through technology and inclusion
      </p>

      <form>

        <div class="input-group">
          <label>Full Name</label>
          <input type="text" 
          placeholder="Enter your full name">
        </div>

        <div class="input-group">
          <label>Email Address</label>
          <input type="email"
          placeholder="Enter your email">
        </div>

        <div class="input-group">
          <label>Phone Number</label>
          <input type="tel"
          placeholder="Enter phone number">
        </div>

        <div class="input-group">
          <label>Gender Identity</label>

          <select>
            <option>Select Option</option>
            <option>Male</option>
            <option>Female</option>
            <option>Non-binary</option>
            <option>Transgender</option>
            <option>Prefer not to say</option>
            <option>Other</option>
          </select>
        </div>

        <div class="input-group">
          <label>Sexual Orientation</label>

          <select>
            <option>Select Option</option>
            <option>Straight</option>
            <option>Gay</option>
            <option>Lesbian</option>
            <option>Bisexual</option>
            <option>Pansexual</option>
            <option>Asexual</option>
            <option>Prefer not to say</option>
            <option>Other</option>
          </select>
        </div>

        <div class="input-group">
          <label>Support Needed</label>

          <select>
            <option>Mentorship</option>
            <option>Counseling</option>
            <option>Legal Support</option>
            <option>Internship Opportunities</option>
            <option>Education Opportunities</option>
            <option>Report Discrimination</option>
          </select>
        </div>

        <div class="input-group">
          <label>Tell Us More</label>

          <textarea rows="5"
          placeholder="Describe your situation or request"></textarea>
        </div><br>

        <button type="submit">
          Submit Application
        </button>

      </form>

    </div>

  </div>
</body>
</html>
