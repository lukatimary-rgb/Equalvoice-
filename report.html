<h1>Report Discrimination</h1>

<p>
Users can safely report harassment,
violence, or discrimination incidents.
</p>

<form class="report-form">

<input type="text"
placeholder="Full Name">

<input type="email"
placeholder="Email Address">

<select>
<option>Type of Discrimination</option>
<option>Workplace</option>
<option>School</option>
<option>Online Harassment</option>
<option>Gender Violence</option>
</select>

<textarea rows="6"
placeholder="Describe the incident"></textarea>

<button type="submit">
Submit Report
</button>

</form>
